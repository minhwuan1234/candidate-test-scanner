name: Candidate submission received

on:
  repository_dispatch:
    types:
      - candidate_submission_created

permissions:
  contents: read

concurrency:
  group: candidate-submission-${{ github.event.client_payload.submission_id }}
  cancel-in-progress: false

jobs:
  receive-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ============================================================
      # 1. VALIDATE PAYLOAD FROM SUPABASE
      # ============================================================

      - name: Validate dispatch payload
        shell: bash
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
          CANDIDATE_NAME: ${{ github.event.client_payload.candidate.name }}
          CANDIDATE_EMAIL: ${{ github.event.client_payload.candidate.email }}
          CV_URL: ${{ github.event.client_payload.candidate.cv_url }}
          ANSWER_TESTING_URL: ${{ github.event.client_payload.candidate.answer_testing_url }}
          SUBMITTED_AT: ${{ github.event.client_payload.candidate.submitted_at }}
        run: |
          set -euo pipefail

          test -n "$SUBMISSION_ID"
          test -n "$CANDIDATE_NAME"
          test -n "$CANDIDATE_EMAIL"
          test -n "$ANSWER_TESTING_URL"

          echo "Candidate submission event accepted"
          echo "Submission ID: $SUBMISSION_ID"
          echo "Candidate: $CANDIDATE_NAME"
          echo "Email: $CANDIDATE_EMAIL"

          if [ -n "$CV_URL" ]; then
            echo "CV URL provided"
          else
            echo "CV URL not provided"
          fi

          echo "Answer testing URL provided"
          echo "Submitted at: ${SUBMITTED_AT:-Not provided}"


      # ============================================================
      # 2. STORE RAW PAYLOAD
      # ============================================================

      - name: Store candidate payload
        shell: bash
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail

          printf '%s' "$EVENT_PAYLOAD" > candidate-payload.json

          test -s candidate-payload.json
          jq empty candidate-payload.json

          echo "Candidate payload stored successfully"

          echo "Payload received:"
          jq . candidate-payload.json


      # ============================================================
      # 3. UPLOAD RAW PAYLOAD ARTIFACT
      # ============================================================

      - name: Upload candidate payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.event.client_payload.submission_id }}
          path: candidate-payload.json
          retention-days: 7
          if-no-files-found: error


      # ============================================================
      # 4. GET LARK TENANT ACCESS TOKEN
      # ============================================================

      - name: Get Lark tenant access token
        id: lark-auth
        shell: bash
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          set -euo pipefail

          test -n "$LARK_APP_ID"
          test -n "$LARK_APP_SECRET"

          AUTH_PAYLOAD="$(
            jq -n \
              --arg app_id "$LARK_APP_ID" \
              --arg app_secret "$LARK_APP_SECRET" \
              '{
                app_id: $app_id,
                app_secret: $app_secret
              }'
          )"

          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --request POST \
              --url "https://open.larksuite.com/open-apis/auth/v3/tenant_access_token/internal" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data "$AUTH_PAYLOAD"
          )"

          echo "Lark auth response received"

          AUTH_CODE="$(
            echo "$AUTH_RESPONSE" |
            jq -r '.code // -1'
          )"

          AUTH_MESSAGE="$(
            echo "$AUTH_RESPONSE" |
            jq -r '.msg // "Unknown Lark auth error"'
          )"

          TENANT_ACCESS_TOKEN="$(
            echo "$AUTH_RESPONSE" |
            jq -r '.tenant_access_token // empty'
          )"

          if [ "$AUTH_CODE" != "0" ] || [ -z "$TENANT_ACCESS_TOKEN" ]; then
            echo "::error::Lark authentication failed"
            echo "Code: $AUTH_CODE"
            echo "Message: $AUTH_MESSAGE"
            echo "$AUTH_RESPONSE" | jq .
            exit 1
          fi

          echo "::add-mask::$TENANT_ACCESS_TOKEN"

          echo "tenant_access_token=$TENANT_ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Lark authentication successful"


      # ============================================================
      # 5. BUILD LARK CARD
      # ============================================================

      - name: Build Lark candidate card
        shell: bash
        run: |
          set -euo pipefail

          SUBMISSION_ID="$(
            jq -r '.submission_id // ""' candidate-payload.json
          )"

          CANDIDATE_NAME="$(
            jq -r '.candidate.name // "Not provided"' candidate-payload.json
          )"

          CANDIDATE_EMAIL="$(
            jq -r '.candidate.email // "Not provided"' candidate-payload.json
          )"

          CV_URL="$(
            jq -r '.candidate.cv_url // ""' candidate-payload.json
          )"

          ANSWER_TESTING_URL="$(
            jq -r '.candidate.answer_testing_url // ""' candidate-payload.json
          )"

          SUBMITTED_AT="$(
            jq -r '.candidate.submitted_at // "Not provided"' candidate-payload.json
          )"

          DETAILS_MARKDOWN="$(
            printf '**Candidate:** %s\n**Email:** %s\n**Submitted at:** %s\n**Submission ID:** %s' \
              "$CANDIDATE_NAME" \
              "$CANDIDATE_EMAIL" \
              "$SUBMITTED_AT" \
              "$SUBMISSION_ID"
          )"

          MATERIALS_MARKDOWN="$(
            if [ -n "$CV_URL" ]; then
              printf '[Open CV](%s)\n\n[Open Answer Testing](%s)' \
                "$CV_URL" \
                "$ANSWER_TESTING_URL"
            else
              printf '[Open Answer Testing](%s)' \
                "$ANSWER_TESTING_URL"
            fi
          )"

          jq -n \
            --arg details "$DETAILS_MARKDOWN" \
            --arg materials "$MATERIALS_MARKDOWN" \
            '{
              config: {
                wide_screen_mode: true
              },

              header: {
                template: "blue",

                title: {
                  tag: "plain_text",
                  content: "New Candidate Submission"
                }
              },

              elements: [
                {
                  tag: "div",

                  text: {
                    tag: "lark_md",
                    content: $details
                  }
                },

                {
                  tag: "hr"
                },

                {
                  tag: "div",

                  text: {
                    tag: "lark_md",
                    content: "**Candidate Materials**"
                  }
                },

                {
                  tag: "div",

                  text: {
                    tag: "lark_md",
                    content: $materials
                  }
                }
              ]
            }' > lark-card.json

          jq empty lark-card.json

          echo "Lark card generated successfully"

          echo "Generated card:"
          jq . lark-card.json


      # ============================================================
      # 6. SEND DIRECT LARK CARD
      # ============================================================

      - name: Send direct Lark card
        shell: bash
        env:
          TENANT_ACCESS_TOKEN: ${{ steps.lark-auth.outputs.tenant_access_token }}
          LARK_RECIPIENT_OPEN_ID: ${{ secrets.LARK_RECIPIENT_OPEN_ID }}
        run: |
          set -euo pipefail

          test -n "$TENANT_ACCESS_TOKEN"
          test -n "$LARK_RECIPIENT_OPEN_ID"
          test -s lark-card.json

          CARD_CONTENT="$(
            jq -c '.' lark-card.json
          )"

          MESSAGE_PAYLOAD="$(
            jq -n \
              --arg receive_id "$LARK_RECIPIENT_OPEN_ID" \
              --arg content "$CARD_CONTENT" \
              '{
                receive_id: $receive_id,
                msg_type: "interactive",
                content: $content
              }'
          )"

          echo "Sending Lark card..."
          echo "Receive ID type: open_id"
          echo "Message type: interactive"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output lark-response.json \
              --write-out "%{http_code}" \
              --request POST \
              --url "https://open.larksuite.com/open-apis/im/v1/messages?receive_id_type=open_id" \
              --header "Authorization: Bearer $TENANT_ACCESS_TOKEN" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data "$MESSAGE_PAYLOAD"
          )"

          echo "Lark HTTP status: $HTTP_STATUS"

          if [ ! -s lark-response.json ]; then
            echo "::error::Lark returned an empty response"
            exit 1
          fi

          echo "Lark response:"
          cat lark-response.json
          echo ""

          LARK_CODE="$(
            jq -r '.code // -1' lark-response.json
          )"

          LARK_MESSAGE="$(
            jq -r '.msg // "Unknown Lark message error"' lark-response.json
          )"

          MESSAGE_ID="$(
            jq -r '.data.message_id // empty' lark-response.json
          )"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Lark HTTP request failed"
            echo "HTTP status: $HTTP_STATUS"
            echo "Lark code: $LARK_CODE"
            echo "Lark message: $LARK_MESSAGE"
            exit 1
          fi

          if [ "$LARK_CODE" != "0" ]; then
            echo "::error::Lark rejected the message"
            echo "Lark code: $LARK_CODE"
            echo "Lark message: $LARK_MESSAGE"
            exit 1
          fi

          echo "Lark card sent successfully"
          echo "Message ID: $MESSAGE_ID"


      # ============================================================
      # 7. UPLOAD GENERATED LARK CARD
      # ============================================================

      - name: Upload Lark card artifact
        uses: actions/upload-artifact@v4
        with:
          name: lark-card-${{ github.event.client_payload.submission_id }}
          path: |
            lark-card.json
            lark-response.json
          retention-days: 7
          if-no-files-found: error
