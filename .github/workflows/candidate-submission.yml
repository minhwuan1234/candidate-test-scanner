name: Candidate submission received

on:
  repository_dispatch:
    types:
      - candidate_submission_created

permissions:
  contents: read

concurrency:
  group: candidate-submission-${{ github.event.client_payload.submission_id }}
  cancel-in-progress: false

jobs:
  receive-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ============================================================
      # 1. CHECK DUPLICATE REQUEST
      # ============================================================
      - name: Check duplicate submission
        id: dedupe
        uses: actions/cache/restore@v4
        with:
          path: .candidate-dedup/${{ github.event.client_payload.submission_id }}
          key: candidate-submission-${{ github.event.client_payload.submission_id }}

      - name: Duplicate submission detected
        if: steps.dedupe.outputs.cache-hit == 'true'
        shell: bash
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
        run: |
          echo "========================================"
          echo "Duplicate candidate submission detected"
          echo "Submission ID: $SUBMISSION_ID"
          echo "This submission has already been processed."
          echo "Lark message will NOT be sent again."
          echo "========================================"

      # ============================================================
      # 2. VALIDATE PAYLOAD
      # ============================================================
      - name: Validate dispatch payload
        if: steps.dedupe.outputs.cache-hit != 'true'
        shell: bash
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
          CANDIDATE_NAME: ${{ github.event.client_payload.candidate.name }}
          CANDIDATE_EMAIL: ${{ github.event.client_payload.candidate.email }}
          CV_URL: ${{ github.event.client_payload.candidate.cv_url }}
          ANSWER_TESTING_URL: ${{ github.event.client_payload.candidate.answer_testing_url }}
          SUBMITTED_AT: ${{ github.event.client_payload.candidate.submitted_at }}
        run: |
          set -euo pipefail

          test -n "$SUBMISSION_ID"
          test -n "$CANDIDATE_NAME"
          test -n "$CANDIDATE_EMAIL"
          test -n "$ANSWER_TESTING_URL"

          echo "Candidate submission event accepted"
          echo "Submission ID: $SUBMISSION_ID"
          echo "Candidate: $CANDIDATE_NAME"
          echo "Email: $CANDIDATE_EMAIL"

          if [ -n "$CV_URL" ]; then
            echo "CV URL provided"
          else
            echo "CV URL not provided"
          fi

          echo "Answer testing URL provided"

      # ============================================================
      # 3. STORE PAYLOAD
      # ============================================================
      - name: Store candidate payload
        if: steps.dedupe.outputs.cache-hit != 'true'
        shell: bash
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail

          printf '%s' "$EVENT_PAYLOAD" > candidate-payload.json

          test -s candidate-payload.json
          jq empty candidate-payload.json

          echo "Candidate payload stored successfully"

      # ============================================================
      # 4. GET LARK TOKEN
      # ============================================================
      - name: Get Lark tenant access token
        if: steps.dedupe.outputs.cache-hit != 'true'
        id: lark-auth
        shell: bash
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          set -euo pipefail

          test -n "$LARK_APP_ID"
          test -n "$LARK_APP_SECRET"

          AUTH_PAYLOAD="$(
            jq -n \
              --arg app_id "$LARK_APP_ID" \
              --arg app_secret "$LARK_APP_SECRET" \
              '{
                app_id: $app_id,
                app_secret: $app_secret
              }'
          )"

          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --request POST \
              --url "https://open.larksuite.com/open-apis/auth/v3/tenant_access_token/internal" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data "$AUTH_PAYLOAD"
          )"

          AUTH_CODE="$(echo "$AUTH_RESPONSE" | jq -r '.code // -1')"
          AUTH_MESSAGE="$(echo "$AUTH_RESPONSE" | jq -r '.msg // "Unknown Lark auth error"')"
          TENANT_ACCESS_TOKEN="$(echo "$AUTH_RESPONSE" | jq -r '.tenant_access_token // empty')"

          if [ "$AUTH_CODE" != "0" ] || [ -z "$TENANT_ACCESS_TOKEN" ]; then
            echo "::error::Lark authentication failed"
            echo "Code: $AUTH_CODE"
            echo "Message: $AUTH_MESSAGE"
            echo "$AUTH_RESPONSE" | jq .
            exit 1
          fi

          echo "::add-mask::$TENANT_ACCESS_TOKEN"
          echo "tenant_access_token=$TENANT_ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Lark authentication successful"

      # ============================================================
      # 5. BUILD LARK CARD
      # ============================================================
      - name: Build Lark candidate card
        if: steps.dedupe.outputs.cache-hit != 'true'
        shell: bash
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
          CANDIDATE_NAME: ${{ github.event.client_payload.candidate.name }}
          CANDIDATE_EMAIL: ${{ github.event.client_payload.candidate.email }}
          CV_URL: ${{ github.event.client_payload.candidate.cv_url }}
          ANSWER_TESTING_URL: ${{ github.event.client_payload.candidate.answer_testing_url }}
          SUBMITTED_AT: ${{ github.event.client_payload.candidate.submitted_at }}

          SETUP_CALL_URL: "https://cal.com/f-creative-krcb9e/30min"

        run: |
          set -euo pipefail

          DETAILS="$(
            printf '**Name**\n%s\n\n**Email**\n%s\n\n**Submitted at**\n%s\n\n**Submission ID**\n%s' \
              "$CANDIDATE_NAME" \
              "$CANDIDATE_EMAIL" \
              "${SUBMITTED_AT:-Not provided}" \
              "$SUBMISSION_ID"
          )"

          if [ -n "$CV_URL" ]; then

            jq -n \
              --arg details "$DETAILS" \
              --arg cv_url "$CV_URL" \
              --arg answer_url "$ANSWER_TESTING_URL" \
              --arg setup_call_url "$SETUP_CALL_URL" \
              '{
                config: {
                  wide_screen_mode: true
                },

                header: {
                  template: "blue",
                  title: {
                    tag: "plain_text",
                    content: "New Candidate Submission"
                  }
                },

                elements: [
                  {
                    tag: "div",
                    text: {
                      tag: "lark_md",
                      content: $details
                    }
                  },

                  {
                    tag: "hr"
                  },

                  {
                    tag: "div",
                    text: {
                      tag: "lark_md",
                      content: "**Candidate Materials**"
                    }
                  },

                  {
                    tag: "action",
                    actions: [
                      {
                        tag: "button",
                        text: {
                          tag: "plain_text",
                          content: "Open CV"
                        },
                        type: "default",
                        url: $cv_url
                      },

                      {
                        tag: "button",
                        text: {
                          tag: "plain_text",
                          content: "Open Answer"
                        },
                        type: "primary",
                        url: $answer_url
                      },

                      {
                        tag: "button",
                        text: {
                          tag: "plain_text",
                          content: "📅 Setup lịch Call"
                        },
                        type: "default",
                        url: $setup_call_url
                      }
                    ]
                  }
                ]
              }' > lark-card.json

          else

            jq -n \
              --arg details "$DETAILS" \
              --arg answer_url "$ANSWER_TESTING_URL" \
              --arg setup_call_url "$SETUP_CALL_URL" \
              '{
                config: {
                  wide_screen_mode: true
                },

                header: {
                  template: "blue",
                  title: {
                    tag: "plain_text",
                    content: "New Candidate Submission"
                  }
                },

                elements: [
                  {
                    tag: "div",
                    text: {
                      tag: "lark_md",
                      content: $details
                    }
                  },

                  {
                    tag: "hr"
                  },

                  {
                    tag: "div",
                    text: {
                      tag: "lark_md",
                      content: "**Candidate Materials**"
                    }
                  },

                  {
                    tag: "action",
                    actions: [
                      {
                        tag: "button",
                        text: {
                          tag: "plain_text",
                          content: "Open Answer"
                        },
                        type: "primary",
                        url: $answer_url
                      },

                      {
                        tag: "button",
                        text: {
                          tag: "plain_text",
                          content: "📅 Setup lịch Call"
                        },
                        type: "default",
                        url: $setup_call_url
                      }
                    ]
                  }
                ]
              }' > lark-card.json

          fi

          jq empty lark-card.json

          echo "Lark card generated successfully"

      # ============================================================
      # 6. SEND CARD TO ALL LARK RECIPIENTS
      # ============================================================
      - name: Send candidate card to Lark
        if: steps.dedupe.outputs.cache-hit != 'true'
        shell: bash
        env:
          TENANT_ACCESS_TOKEN: ${{ steps.lark-auth.outputs.tenant_access_token }}
          LARK_RECIPIENT_OPEN_ID: ${{ secrets.LARK_RECIPIENT_OPEN_ID }}
        run: |
          set -euo pipefail

          test -n "$TENANT_ACCESS_TOKEN"
          test -n "$LARK_RECIPIENT_OPEN_ID"
          test -s lark-card.json

          CARD_CONTENT="$(
            jq -c '.' lark-card.json
          )"

          IFS=',' read -ra RAW_RECIPIENTS <<< "$LARK_RECIPIENT_OPEN_ID"

          declare -A SEEN_RECIPIENTS
          RECIPIENTS=()

          for RAW_RECIPIENT in "${RAW_RECIPIENTS[@]}"; do

            RECIPIENT_OPEN_ID="$(
              printf '%s' "$RAW_RECIPIENT" | xargs
            )"

            if [ -z "$RECIPIENT_OPEN_ID" ]; then
              continue
            fi

            if [[ -n "${SEEN_RECIPIENTS[$RECIPIENT_OPEN_ID]:-}" ]]; then
              echo "Duplicate recipient ignored"
              continue
            fi

            SEEN_RECIPIENTS["$RECIPIENT_OPEN_ID"]=1
            RECIPIENTS+=("$RECIPIENT_OPEN_ID")

          done

          TOTAL_RECIPIENTS="${#RECIPIENTS[@]}"

          if [ "$TOTAL_RECIPIENTS" -eq 0 ]; then
            echo "::error::No valid Lark recipients found"
            exit 1
          fi

          echo "Total unique Lark recipients: $TOTAL_RECIPIENTS"

          SENT_COUNT=0

          for RECIPIENT_OPEN_ID in "${RECIPIENTS[@]}"; do

            RECIPIENT_NUMBER=$((SENT_COUNT + 1))

            echo ""
            echo "========================================"
            echo "Sending to recipient $RECIPIENT_NUMBER/$TOTAL_RECIPIENTS"
            echo "Open ID prefix: ${RECIPIENT_OPEN_ID:0:10}..."
            echo "========================================"

            MESSAGE_PAYLOAD="$(
              jq -n \
                --arg receive_id "$RECIPIENT_OPEN_ID" \
                --arg content "$CARD_CONTENT" \
                '{
                  receive_id: $receive_id,
                  msg_type: "interactive",
                  content: $content
                }'
            )"

            RESPONSE_FILE="lark-response-$RECIPIENT_NUMBER.json"

            HTTP_STATUS="$(
              curl \
                --silent \
                --show-error \
                --output "$RESPONSE_FILE" \
                --write-out "%{http_code}" \
                --request POST \
                --url "https://open.larksuite.com/open-apis/im/v1/messages?receive_id_type=open_id" \
                --header "Authorization: Bearer $TENANT_ACCESS_TOKEN" \
                --header "Content-Type: application/json; charset=utf-8" \
                --data "$MESSAGE_PAYLOAD"
            )"

            echo "Lark HTTP status: $HTTP_STATUS"

            if [ ! -s "$RESPONSE_FILE" ]; then
              echo "::error::Lark returned an empty response"
              exit 1
            fi

            echo "Lark response:"
            cat "$RESPONSE_FILE"
            echo ""

            LARK_CODE="$(
              jq -r '.code // -1' "$RESPONSE_FILE"
            )"

            LARK_MESSAGE="$(
              jq -r '.msg // "Unknown Lark error"' "$RESPONSE_FILE"
            )"

            MESSAGE_ID="$(
              jq -r '.data.message_id // empty' "$RESPONSE_FILE"
            )"

            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "::error::Lark HTTP request failed"
              echo "HTTP status: $HTTP_STATUS"
              echo "Lark code: $LARK_CODE"
              echo "Lark message: $LARK_MESSAGE"
              exit 1
            fi

            if [ "$LARK_CODE" != "0" ]; then
              echo "::error::Lark rejected the card"
              echo "Code: $LARK_CODE"
              echo "Message: $LARK_MESSAGE"
              exit 1
            fi

            SENT_COUNT=$((SENT_COUNT + 1))

            echo "Candidate card sent successfully"
            echo "Message ID: $MESSAGE_ID"

          done

          echo ""
          echo "========================================"
          echo "Lark delivery completed"
          echo "Successfully sent to: $SENT_COUNT recipient(s)"
          echo "========================================"

      # ============================================================
      # 7. MARK SUBMISSION AS PROCESSED
      # ============================================================
      - name: Create processed marker
        if: steps.dedupe.outputs.cache-hit != 'true' && success()
        shell: bash
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
        run: |
          set -euo pipefail

          mkdir -p .candidate-dedup

          printf '%s\n' "$SUBMISSION_ID" \
            > ".candidate-dedup/$SUBMISSION_ID"

          echo "Submission marked as processed"
          echo "Submission ID: $SUBMISSION_ID"

      - name: Save processed submission
        if: steps.dedupe.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .candidate-dedup/${{ github.event.client_payload.submission_id }}
          key: candidate-submission-${{ github.event.client_payload.submission_id }}

      # ============================================================
      # 8. UPLOAD DEBUG FILES
      # ============================================================
      - name: Upload debug artifacts
        if: always() && steps.dedupe.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lark-debug-${{ github.event.client_payload.submission_id }}
          path: |
            candidate-payload.json
            lark-card.json
            lark-response-*.json
          retention-days: 7
          if-no-files-found: ignore

      # ============================================================
      # 9. COMPLETE
      # ============================================================
      - name: Complete job
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.dedupe.outputs.cache-hit }}" = "true" ]; then
            echo "Job completed: duplicate submission skipped"
          else
            echo "Job completed"
          fi
